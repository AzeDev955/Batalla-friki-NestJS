version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: batalla_friki_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: batalla_friki
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
